services:
  - type: web
    name: soarlodge-api-demo
    runtime: node
    plan: free
    rootDir: Semana 5
    buildCommand: npm ci
    startCommand: node server/mock-api.mjs
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGIN
        value: https://ladyred145.github.io
